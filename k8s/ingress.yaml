apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowops-ingress
  namespace: flowops
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowops-service
                port:
                  number: 80
